name: Deploy

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release

      - uses: ncipollo/release-action@v1
        with:
          artifacts: 'target/release/VencordAutoPatcher.exe'
          bodyFile: 'body.md'
          tag: v1.0.${{ github.run_number }}
